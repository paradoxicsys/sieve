[workspace]
resolver = "2"
members = ["crates/sieve-core", "crates/sieve-cli", "crates/sieve-bench"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
arrow = { version = "59", default-features = false }
bytes = "1"
clap = { version = "4", features = ["derive"] }
criterion = "0.8"
crossbeam-channel = "0.5"
flate2 = "1"
futures = "0.3"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
object_store = { version = "0.14", features = ["aws", "http"] }
parquet = { version = "59", default-features = false, features = ["arrow", "zstd"] }
proptest = "1"
rayon = "1"
regex = "1"
scraper = "0.29"
ego-tree = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
warc = { version = "0.4", default-features = false }
whatlang = "0.18"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sieve-core = { path = "crates/sieve-core" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"

[profile.release]
debug = "line-tables-only"   # keep symbols for profiling; no runtime cost
lto = "thin"
codegen-units = 4

[profile.bench]
debug = "line-tables-only"

# Tests (proptest, Parquet round-trips) are much faster with optimised deps.
[profile.dev.package."*"]
opt-level = 2
